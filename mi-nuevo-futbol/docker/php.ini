; Ajustes de PHP para producción.
; Los límites de subida por defecto de PHP (2 MB) rechazarían las fotos de cancha (hasta 6 MB)
; y los diseños de uñas (hasta 4 MB) que el sistema sí admite.
upload_max_filesize = 8M
post_max_size = 12M
memory_limit = 256M
max_execution_time = 60
expose_php = Off

; El sistema calcula sus horas con su propia zona (config/canchas.php); PHP queda en UTC
date.timezone = UTC

; Caché de código: el código no cambia mientras el contenedor está en marcha
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
